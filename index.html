<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Finance</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app" class="max-w-3xl mx-auto px-5 py-8"></div>
<div id="bottom-nav"></div>
<button class="desktop-fab" onclick="fabOpen()" title="Add transaction">+</button>

<!-- Load order matters: config (state/save) → utils → actions (handlers) → render → app (auth boots the app) -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/actions.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>

<!-- Toast container -->
<div id="toast-container" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none;min-width:260px;max-width:340px;align-items:center"></div>
</body>
</html>
