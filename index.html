];

// ═══════════════════════════════════════════════════════
// DEFAULT TRANSACTIONS — May 2026 pre-loaded from Google Sheets
// ═══════════════════════════════════════════════════════
const defaultTransactions = [];

// ═══════════════════════════════════════════════════════
// DEFAULT STATE — truly empty for new users
// ═══════════════════════════════════════════════════════
const defaultState = {
  accounts:     [],
  creditCards:  [],
  recurring:    [],
  goals:        [],
  forecastDays: 7,
  categories:   defaultCategories,
  transactions: [],
};

// ═══════════════════════════════════════════════════════
// STATE MIGRATION (reused for localStorage + Supabase)
// ═══════════════════════════════════════════════════════
function migrateState(p) {
  if (!p.categories)              p.categories   = JSON.parse(JSON.stringify(defaultCategories));
  if (!Array.isArray(p.transactions)) p.transactions = [];
  if (!Array.isArray(p.accounts))     p.accounts     = [];
  if (!Array.isArray(p.creditCards))  p.creditCards  = [];
  if (!Array.isArray(p.recurring))    p.recurring    = [];
  if (!Array.isArray(p.goals))        p.goals        = [];
  if (p.transactions) p.transactions.forEach(t => { if (t.toAccountId===undefined) t.toAccountId=''; });
  if (p.accounts) p.accounts.forEach(a => {
    if (!a.type) a.type = ['gcash','maya'].includes(a.id) ? 'ewallet' : a.id==='cash' ? 'cash' : 'bank';
    if (!a.icon) a.icon = a.type==='bank' ? '🏦' : a.type==='ewallet' ? '📱' : '💵';
    if (a.maintainingBalance===undefined) a.maintainingBalance=0;
  });
  if (p.creditCards) p.creditCards.forEach(c => { if (!c.icon) c.icon = '💳'; if (c.lastStatement===undefined) c.lastStatement=0; if (c.maintainingBalance===undefined) c.maintainingBalance=0; if (c.cutoffDay===undefined) c.cutoffDay = c.cycleStartDay ? Math.max(1,c.cycleStartDay-1) : 22; delete c.cycleStartDay; if (c.minDue===undefined) c.minDue=0; });
  if (p.recurring) p.recurring.forEach(r => {
    if (r.dueDay !== undefined && !r.frequency) {
      r.frequency = 'monthly'; r.active = true;
      const dd = String(r.dueDay).padStart(2,'0');
      const thisM = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${dd}`;
      const nx = new Date(now.getFullYear(), now.getMonth()+1, r.dueDay);
      r.nextDue = (todayISO <= thisM) ? thisM : nx.toISOString().split('T')[0];
      r.categoryId = r.categoryId||''; r.subcategoryId = r.subcategoryId||'';
      r.accountId = r.accountId||''; r.lastPosted = null;
      delete r.dueDay; delete r.variable;
    }
    if (r.active===undefined) r.active=true;
    const recCatMap = {
      r1:{c:'c1',s:'s1'}, r2:{c:'c4',s:'s32'}, r3:{c:'c7',s:'s61'},
      r4:{c:'c7',s:'s64'}, r5:{c:'c14',s:'s130'}, r6:{c:'c15',s:'s140'}, r7:{c:'c16',s:'s150'}
    };
    if (recCatMap[r.id] && !r.categoryId) { r.categoryId=recCatMap[r.id].c; r.subcategoryId=recCatMap[r.id].s; }
  });
  if (p.goals) p.goals.forEach(g => {
    if (!g.deposits) {
      g.deposits = (g.saved>0) ? [{id:'d_init_'+g.id, date:todayISO, amount:g.saved||0, note:'Initial balance'}] : [];
      delete g.saved;
    }
    if (g.linkedCategoryId===undefined)    g.linkedCategoryId='';
    if (g.linkedSubcategoryId===undefined) g.linkedSubcategoryId='';
    delete g.status;
  });
  return p;
}

// State starts empty — filled by loadFromSupabase after auth resolves

let state = JSON.parse(JSON.stringify(defaultState));

const save = () => {
  const lsKey = currentUser ? STORAGE_KEY + '_' + currentUser.id : STORAGE_KEY;
  try { localStorage.setItem(lsKey, JSON.stringify(state)); } catch(e) {}
  // Debounced Supabase sync — waits 1.5s after last change before writing
  if (syncTimeout) clearTimeout(syncTimeout);
  syncTimeout = setTimeout(async () => {
    if (!currentUser) return;
    try {
      await sb.from('finance_state').upsert({
        user_id: currentUser.id,
        state: state,
        updated_at: new Date().toISOString()
      }, { onConflict: 'user_id' });
      showSyncIndicator('✓ Synced');
    } catch(e) { showSyncIndicator('⚠ Offline'); }
  }, 1500);
};

const fmt  = n => '₱' + Math.round(n).toLocaleString('en-PH');
const fmt2 = n => '₱' + n.toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2});
const sfx  = d => d>3&&d<21?'th':{1:'st',2:'nd',3:'rd'}[d%10]||'th';
const totalAssets    = () => state.accounts.reduce((s,a)=>s+a.balance,0);
const spendableAssets= () => state.accounts.reduce((s,a)=>s+(a.balance-(a.maintainingBalance||0)),0);
const totalLiab      = () => state.creditCards.reduce((s,c)=>s+c.outstanding,0);
const netWorth       = () => totalAssets()-totalLiab();
// Find any account OR credit card by id — used wherever a transaction's accountId may be a CC
const findAccount = id => state.accounts.find(a=>a.id===id) || state.creditCards.find(c=>c.id===id) || null;

function daysUntil(dueDay) {
  const d = now.getDate();
  if (dueDay >= d) return dueDay - d;
  const next = new Date(now.getFullYear(), now.getMonth()+1, dueDay);
  return Math.ceil((next - now)/(1000*60*60*24));
}
function monthsBetween(ds) {
  const t = new Date(ds);
  return Math.max((t.getFullYear()-now.getFullYear())*12+(t.getMonth()-now.getMonth()),0);
}
function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-PH', { month:'short', day:'numeric', year:'numeric' });
}
function fmtDateShort(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-PH', { month:'short', day:'numeric' });
}

function advanceDue(dateStr, freq) {
  const d = new Date(dateStr + 'T00:00:00');
  switch(freq) {
    case 'daily':     d.setDate(d.getDate()+1); break;
    case 'weekly':    d.setDate(d.getDate()+7); break;
    case 'biweekly':  d.setDate(d.getDate()+14); break;
    case 'monthly':   d.setMonth(d.getMonth()+1); break;
    case 'quarterly': d.setMonth(d.getMonth()+3); break;
    case 'yearly':    d.setFullYear(d.getFullYear()+1); break;
  }
  return d.toISOString().split('T')[0];
}

function checkAndPostRecurring() {
  if (recurringChecked) return 0;
  recurringChecked = true;
  if (!state.recurring?.length) return 0;
  let posted = 0;
  state.recurring.forEach(r => {
    if (!r.active || !r.nextDue) return;
    let safety = 0;
    while (r.nextDue <= todayISO && safety < 24) {
      safety++;
      state.transactions.push({
        id: 'tx_auto_' + Date.now() + '_' + (Math.random()*99999|0),
        date: r.nextDue,
        type: r.type,
        amount: r.amount,
        description: r.name,
        categoryId: r.categoryId||'',
        subcategoryId: r.subcategoryId||'',
        accountId: r.accountId||'',
        notes: 'Auto-posted'
      });
      const acct = findAccount(r.accountId);
      if (acct) acct.balance += (r.type==='income' ? r.amount : -r.amount);
      r.lastPosted = r.nextDue;
      r.nextDue = advanceDue(r.nextDue, r.frequency);
      posted++;
    }
  });
  if (posted > 0) { recAutoPostedCount = posted; save(); }
  return posted;
}

function computeGoalSaved(g) {
  const manual = (g.deposits||[]).reduce((s,d)=>s+d.amount,0);
  let auto = 0;
  if (g.linkedCategoryId) {
    auto = state.transactions
      .filter(t=>t.categoryId===g.linkedCategoryId && (!g.linkedSubcategoryId||t.subcategoryId===g.linkedSubcategoryId))
      .reduce((s,t)=>s+t.amount,0);
  }
  return { manual, auto, total:manual+auto };
}

function getMonthlyData() {
  const yr = now.getFullYear(), mo = now.getMonth();
  const fallbackMonthly = { avgMonthlyExpenses: state.monthly?.avgMonthlyExpenses||0, categories: state.monthly?.categories||[] };
  const monthTx = (state.transactions||[]).filter(t => {
    const d = new Date(t.date + 'T00:00:00');
    return d.getFullYear()===yr && d.getMonth()===mo;
  });
  if (monthTx.length === 0) return { income:0, expenses:0, label: currentMonthLabel, ...fallbackMonthly };

  const income   = monthTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount, 0);
  const expenses = monthTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount, 0);
  const catMap = {};
  monthTx.filter(t=>t.type==='expense').forEach(t => {
    if (!t.categoryId) return;
    catMap[t.categoryId] = (catMap[t.categoryId]||0) + t.amount;
  });
  const palette = ['#6366f1','#f59e0b','#10b981','#3b82f6','#ec4899','#8b5cf6','#06b6d4'];
  const topCats = Object.entries(catMap)
    .sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([cid,amt],i) => {
      const cat = state.categories.find(c=>c.id===cid);
      return { id:'mc_'+cid, name:cat?.name||'Other', icon:cat?.icon||'❓', amount:Math.round(amt), color:palette[i]||'#6b7280' };
    });
  return { ...fallbackMonthly, label: currentMonthLabel, income, expenses, categories: topCats.length ? topCats : fallbackMonthly.categories };
}

function editable(value, path, formatter) {
  const disp = (value===0) ? '—' : (formatter?formatter(value):value);
  return `<span class="editable px-1" data-path="${path}" data-val="${value}">${disp}</span>`;
}
function attachEdits() {
  document.querySelectorAll('[data-path]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const path = el.dataset.path;
      const inp = document.createElement('input');
      inp.type='number'; inp.step='0.01'; inp.value=parseFloat(el.dataset.val); inp.className='editable-input';
      el.replaceWith(inp); inp.focus(); inp.select();
      const commit = () => { const v=parseFloat(inp.value); if(!isNaN(v)) setPath(path,v); render(); };
      inp.addEventListener('blur', commit);
      inp.addEventListener('keydown', ev => { if(ev.key==='Enter') commit(); if(ev.key==='Escape') render(); });
    });
  });
}
function setPath(path, val) {
  const [col,...rest] = path.split('.');
  if (col==='accounts') {
    const [id,field]=rest; const item=state.accounts.find(x=>x.id===id); if(item) item[field]=val;
  } else if (col==='creditCards') {
    const [id,field]=rest; const item=state.creditCards.find(x=>x.id===id); if(item) item[field]=val;
  } else if (col==='monthly') {
    const [field,id,prop]=rest;
    if (!state.monthly) state.monthly = { avgMonthlyExpenses:0, categories:[] };
    if (field==='categories') { const item=(state.monthly.categories||[]).find(x=>x.id===id); if(item) item[prop]=val; }
    else state.monthly[field]=val;
  } else if (col==='goals') {
    const [id,field]=rest; const item=state.goals.find(x=>x.id===id); if(item) item[field]=val;
  }
  save();
}

window.txSave = () => {
  const desc    = document.getElementById('tx-desc').value.trim();
  const type    = document.getElementById('tx-type').value;
  const date    = document.getElementById('tx-date').value;
  const amt     = parseFloat(document.getElementById('tx-amount').value);
  const catId   = document.getElementById('tx-cat').value;
  const subId   = document.getElementById('tx-subcat').value;
  const accId   = document.getElementById('tx-account').value;
  const notes   = document.getElementById('tx-notes').value.trim();
  const toAccId = document.getElementById('tx-toaccount')?.value || '';
  // Transfers don't require a category; others do
  const needsCat = type !== 'transfer';
  if (!desc || !date || isNaN(amt) || amt <= 0 || !accId || (needsCat && !catId)) {
    document.getElementById('tx-error').textContent = 'Please fill in all required fields.';
    return;
  }
  if (txUI.editId) {
    // Edit existing — reverse old CC effect, apply new
    const tx = state.transactions.find(t => t.id === txUI.editId);
    if (tx) {
      if (tx.notes!=='CC payment') adjustCC(tx.accountId, tx.type, tx.amount, -1); // reverse old
      tx.date = date; tx.description = desc; tx.type = type; tx.amount = amt;
      tx.categoryId = catId; tx.subcategoryId = subId; tx.accountId = accId;
      tx.notes = notes; tx.toAccountId = toAccId;
      if (tx.notes!=='CC payment') adjustCC(accId, type, amt, +1); // apply new
    }
  } else {
    // Add new
    state.transactions.push({
      id: 'tx_'+Date.now(),
      date, description: desc, type, amount: amt,
      categoryId: catId, subcategoryId: subId, accountId: accId,
      toAccountId: toAccId, notes
    });
    adjustCC(accId, type, amt, +1);
  }
  save(); txUI.showModal=false; txUI.editId=null; render();
};

// ── CC outstanding auto-adjustment ──────────────────────
// Apply a transaction's effect on CC outstanding (delta = +amt or -amt)
function adjustCC(accountId, type, amount, delta) {
  // Only affects credit cards, not debit accounts
  const cc = state.creditCards.find(c=>c.id===accountId);
  if (!cc) return;
  if (type==='expense') cc.outstanding = Math.max(0, cc.outstanding + delta * amount);
  // income to a CC = refund/cashback → reduces outstanding
  if (type==='income')  cc.outstanding = Math.max(0, cc.outstanding - delta * amount);
}

window.ccRecordPayment = id => {
  const c = state.creditCards.find(x=>x.id===id); if(!c) return;
  const amt   = parseFloat(document.getElementById('cc-pay-amt')?.value);
  const fromId = document.getElementById('cc-pay-from')?.value;
  const date  = document.getElementById('cc-pay-date')?.value || todayISO;
  if(isNaN(amt)||amt<=0){ document.getElementById('cc-pay-err').textContent='Enter a valid amount.'; return; }
  // Log a transfer transaction: from debit account → CC (as a payment)
  state.transactions.push({
    id:'tx_'+Date.now(), date, description:`${c.name} Payment`,
    type:'expense', amount:amt,
    categoryId:'', subcategoryId:'',
    accountId: fromId||'', toAccountId: id,
    notes:'CC payment'
  });
  // Reduce outstanding balance
  c.outstanding = Math.max(0, c.outstanding - amt);
  // If fully paid, set lastStatement to 0 as well (fresh cycle)
  if(c.outstanding===0) c.lastStatement=0;
  save(); acctUI.paymentCCId=null; render();
};
// Compute current cycle spending from transactions tagged to this CC
// Compute dates for a CC's billing cycle based on cutoffDay
window.ccCycleDates = id => {
  const c = state.creditCards.find(x=>x.id===id); if(!c) return null;
  const cutoff = c.cutoffDay||22;
  const cycleStartDay = cutoff===31 ? 1 : cutoff+1; // day after cutoff
  const d = now.getDate();
  // Current cycle start: if today >= cycleStartDay, it started this month; else last month
  let cycleStartDate, cutoffDate;
  if(d >= cycleStartDay) {
    cycleStartDate = new Date(now.getFullYear(), now.getMonth(), cycleStartDay);
    cutoffDate     = new Date(now.getFullYear(), now.getMonth(), cutoff);
    // If cutoff < cycleStartDay it's in the same month (e.g. start=23, cutoff=22 → cutoff is next month)
    if(cutoff < cycleStartDay) cutoffDate = new Date(now.getFullYear(), now.getMonth()+1, cutoff);
  } else {
    cycleStartDate = new Date(now.getFullYear(), now.getMonth()-1, cycleStartDay);
    cutoffDate     = new Date(now.getFullYear(), now.getMonth(), cutoff);
  }
  // Due date: dueDay in the month after cutoff
  const cutoffMo = cutoffDate.getMonth(), cutoffYr = cutoffDate.getFullYear();
  const dueDate  = new Date(cutoffYr, cutoffMo+1, c.dueDay||1);
  const daysToC  = Math.ceil((cutoffDate - now + 86400000) / 86400000);
  const daysToD  = Math.ceil((dueDate   - now + 86400000) / 86400000);
  return {
    cycleStart: cycleStartDate.toISOString().split('T')[0],
    cutoff:     cutoffDate.toISOString().split('T')[0],
    due:        dueDate.toISOString().split('T')[0],
    daysToCutoff: Math.max(0, daysToC),
    daysToDue:    Math.max(0, daysToD),
    cycleStartDay, cutoffDay: cutoff
  };
};
// New charges since current cycle start (posted to this CC)
window.ccCycleSpend = id => {
  const dates = ccCycleDates(id); if(!dates) return 0;
  return (state.transactions||[])
    .filter(t=>t.accountId===id && t.type==='expense' && t.date>=dates.cycleStart && t.notes!=='CC payment')
    .reduce((s,t)=>s+t.amount,0);
};

function renderTransactions() {
  // Filter transactions
  const yr = now.getFullYear(), mo = now.getMonth();
  const lastMoYr = mo === 0 ? yr - 1 : yr;
  const lastMo   = mo === 0 ? 11 : mo - 1;
  let list = [...state.transactions].sort((a,b)=>new Date(b.date)-new Date(a.date));
  if      (txUI.filter==='month')     list = list.filter(t=>{ const d=new Date(t.date+'T00:00:00'); return d.getFullYear()===yr&&d.getMonth()===mo; });
  else if (txUI.filter==='lastMonth') list = list.filter(t=>{ const d=new Date(t.date+'T00:00:00'); return d.getFullYear()===lastMoYr&&d.getMonth()===lastMo; });
  else if (txUI.filter==='expense')   list = list.filter(t=>t.type==='expense');
  else if (txUI.filter==='income')    list = list.filter(t=>t.type==='income');

  const totalIncome   = list.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const totalExpense  = list.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const net = totalIncome - totalExpense;

  // Group by date
  const grouped = {};
  list.forEach(t => { if(!grouped[t.date]) grouped[t.date]=[]; grouped[t.date].push(t); });
  const sortedDates = Object.keys(grouped).sort((a,b)=>new Date(b)-new Date(a));

  const rowsHTML = sortedDates.map(date => {
    const rows = grouped[date].map(tx => {
      const cat    = state.categories.find(c=>c.id===tx.categoryId);
      const subcat = cat?.subs.find(s=>s.id===tx.subcategoryId);
      const isDeleting = txUI.deleteId === tx.id;
      if (isDeleting) return `
        <div class="tx-row" style="background:#1a0f0f;border-radius:10px;padding:10px 12px;margin:4px 0;border:1px solid #7f1d1d">
          <div class="flex-1 text-sm" style="color:#fca5a5">Delete <strong>${tx.description}</strong> (${fmt(tx.amount)})? This cannot be undone.</div>
          <div class="flex gap-2 flex-shrink-0">
            <button onclick="txConfirmDelete()" class="text-xs px-3 py-1.5 rounded-lg font-semibold" style="background:#ef4444;border:none;color:#fff;cursor:pointer">Delete</button>
            <button onclick="txCancelDelete()" class="text-xs px-3 py-1.5 rounded-lg" style="background:#374151;border:none;color:#9ca3af;cursor:pointer">Cancel</button>
          </div>
        </div>`;
      return `
        <div class="tx-row">
          <div class="tx-icon">${cat?.icon||'💸'}</div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-medium truncate" style="color:#e5e7eb">${tx.description}</div>
            <div class="text-xs mt-0.5" style="color:#6b7280">${tx.type==='transfer'?`🔄 Transfer → ${findAccount(tx.toAccountId)?.name||'?'}`:cat?.name||''}${subcat?' · '+subcat.name:''}${(() => { const a=findAccount(tx.accountId); return a ? ` · <span style="color:${state.creditCards.find(c=>c.id===tx.accountId)?'#f59e0b':'#4b5563'}">${a.icon||''}${state.creditCards.find(c=>c.id===tx.accountId)?' CC':''} ${a.name}</span>` : ''; })()}</div>
          </div>
          <div class="flex items-center gap-2 flex-shrink-0">
            <div class="text-sm font-semibold ${tx.type==='income'?'text-emerald-400':tx.type==='transfer'?'text-indigo-400':'text-red-400'}">
              ${tx.type==='income'?'+':tx.type==='transfer'?'⇄':'-'}${fmt(tx.amount)}
            </div>
            <button onclick="txOpenEdit('${tx.id}')" class="text-gray-600 hover:text-indigo-400 transition-colors text-sm leading-none" style="background:none;border:none;cursor:pointer;padding:2px 4px" title="Edit">✏️</button>
            <button onclick="txAskDelete('${tx.id}')" class="text-gray-700 hover:text-red-400 transition-colors text-base leading-none" style="background:none;border:none;cursor:pointer;padding:2px 4px">×</button>
          </div>
        </div>`;
    }).join('');
    return `
      <div class="mb-4">
        <div class="section-label mb-2">${fmtDate(date)}</div>
        ${rows}
      </div>`;
  }).join('');



  const filterLabels = {month:'This Month', lastMonth:'Last Month', expense:'Expenses', income:'Income', all:'All Time'};
  const filters = ['month','lastMonth','expense','income','all'];

  // Modal: supports Add and Edit mode
  const activeCatOptions = (type, selId='') => state.categories.filter(c=>c.type===type&&c.active)
    .map(c=>`<option value="${c.id}" ${c.id===selId?'selected':''}>${c.icon} ${c.name}</option>`).join('');
  const acctOptions = (selId='', includeCCs=true) => {
    const debitOpts = state.accounts.map(a=>`<option value="${a.id}" ${a.id===selId?'selected':''}>${a.icon||'🏦'} ${a.name}</option>`).join('');
    const ccOpts    = includeCCs ? state.creditCards.map(c=>`<option value="${c.id}" ${c.id===selId?'selected':''}>${c.icon||'💳'} ${c.name} (CC)</option>`).join('') : '';
    if (!ccOpts) return debitOpts;
    return `<optgroup label="── Debit / Cash ──">${debitOpts}</optgroup><optgroup label="── Credit Cards ──">${ccOpts}</optgroup>`;
  };

  let modalHtml = '';
  if (txUI.showModal) {
    const ex = txUI.editId ? state.transactions.find(t=>t.id===txUI.editId) : null;
    const initType  = ex?.type || 'expense';
    const initDate  = ex?.date || todayISO;

    const initDesc  = ex?.description || '';
    const initNotes = ex?.notes || '';
    const initCat   = ex?.categoryId || '';
    const initSubCat= ex?.subcategoryId || '';
    const initAcct  = ex?.accountId || '';
    const initToAcct= ex?.toAccountId || '';
    const isEdit    = !!ex;
    // Pre-build subcategory options for edit mode
    const initSubOpts = (() => {
      if (!initCat) return '<option value="">— Select subcategory (optional) —</option>';
      const c = state.categories.find(x=>x.id===initCat);
      if (!c) return '<option value="">— Select subcategory (optional) —</option>';
      return '<option value="">— Select subcategory (optional) —</option>' +
        c.subs.filter(s=>s.active).map(s=>`<option value="${s.id}" ${s.id===initSubCat?'selected':''}>${s.name}</option>`).join('');
    })();
    const btnStyle = (t) => t===initType
      ? `background:#1d2027;border:1px solid #374151;color:${t==='income'?'#34d399':t==='expense'?'#f87171':'#818cf8'}`
      : 'background:transparent;border:1px solid transparent;color:#6b7280';
    modalHtml = `
    <div class="fixed inset-0 flex items-end sm:items-center justify-center" style="z-index:200;background:rgba(0,0,0,0.8)" onclick="txCloseModal()">
      <div class="w-full sm:w-96 rounded-t-3xl sm:rounded-2xl p-6" style="background:#1d2027;border:1px solid #374151;max-height:92vh;overflow-y:auto" onclick="event.stopPropagation()">
        <div class="flex items-center justify-between mb-5">
          <div class="text-lg font-bold">${isEdit?'Edit Transaction':'Add Transaction'}</div>
          <button onclick="txCloseModal()" style="background:none;border:none;color:#6b7280;cursor:pointer;font-size:20px;line-height:1">×</button>
        </div>

        <div class="field-label">TYPE</div>
        <div class="inline-flex p-1 rounded-xl mb-4 gap-1 w-full" style="background:#0f1116;border:1px solid #1f2937">

          <button id="btn-transfer" onclick="txSetType('transfer')" class="flex-1 rounded-lg py-2 text-sm font-medium" style="${btnStyle('transfer')}">🔄 Transfer</button>
        </div>
        <input type="hidden" id="tx-type" value="${initType}">

    <!-- Filter tabs -->
    <div class="flex gap-2 mb-5 flex-wrap">

        <button onclick="txSetFilter('${f}')" class="text-xs px-3 py-1.5 rounded-full transition-all"

    <!-- Transaction list -->

        ? `<div class="text-center py-12" style="color:#6b7280">

  const activeCount=filtered.filter(c=>c.active).length;
  const cards=filtered.map(cat=>{
    const isExpanded=catUI.expanded===cat.id, activeSubs=cat.subs.filter(s=>s.active).length;
    const toggleBg=cat.active?'#10b981':'#374151', knobLeft=cat.active?'19px':'3px';
    const subsSection=isExpanded?`

    return `<div class="rounded-2xl overflow-hidden" style="background:#1d2027;${cat.active?'':'opacity:0.5'}">

        <div id="cat-icon-${cat.id}" onclick="catStartRenameIcon('${cat.id}')" class="flex-shrink-0 flex items-center justify-center rounded-xl text-xl cursor-pointer" style="width:44px;height:44px;background:#0f1116;border:1px solid #1f2937">${cat.icon}</div>
        <div class="flex-1 min-w-0">
          <div id="cat-name-${cat.id}" ondblclick="catStartRenameCategory('${cat.id}')" class="font-semibold text-sm truncate" style="color:#e5e7eb;cursor:text">${cat.name}</div>
          <div class="text-xs mt-0.5" style="color:#6b7280">${activeSubs}/${cat.subs.length} subcategories</div>
        </div>
        <div class="flex items-center gap-3 flex-shrink-0">
          <div class="cat-toggle" onclick="catToggle('${cat.id}')" style="width:38px;height:22px;background:${toggleBg}"><div class="cat-toggle-knob" style="left:${knobLeft}"></div></div>
          <button onclick="catToggleExpand('${cat.id}')" style="background:none;border:none;cursor:pointer;color:#9ca3af;font-size:20px;line-height:1;padding:0;transform:rotate(${isExpanded?'180':'0'}deg);transition:transform 0.2s">⌄</button>
        </div>
      </div>${subsSection}</div>`;
  }).join('');
  const modal=catUI.showModal?`
    <div class="fixed inset-0 z-50 flex items-center justify-center" style="background:rgba(0,0,0,0.8)" onclick="catCloseModal()">
      <div class="rounded-2xl p-7 w-80" style="background:#1d2027;border:1px solid #374151" onclick="event.stopPropagation()">
        <div class="text-lg font-bold mb-1">New ${catUI.tab==='expense'?'Expense':'Income'} Category</div>
        <div class="text-sm mb-5" style="color:#6b7280">Fill in the details below.</div>
        <div class="section-label mb-1.5">EMOJI ICON</div>

        <div class="section-label mb-1.5">CATEGORY NAME</div>

  return `${renderNav()}
    <div class="flex items-center justify-between mb-1">
      <div class="text-2xl font-bold">Categories</div>
      <button onclick="catOpenModal()" class="rounded-xl px-4 py-2.5 text-sm font-semibold text-white flex-shrink-0" style="background:#6366f1;border:none;cursor:pointer">+ Add</button>
    </div>
    <div class="section-label mb-5">${expCount} Expense &nbsp;&middot;&nbsp; ${incCount} Income &nbsp;&middot;&nbsp; ${activeCount} Active</div>
    <div class="inline-flex p-1 rounded-xl mb-5 gap-1" style="background:#0f1116;border:1px solid #1f2937">

      <button onclick="catSetTab('income')" class="rounded-lg px-5 py-2 text-sm font-medium" style="${catUI.tab==='income'?'background:#1d2027;color:#e5e7eb;border:1px solid #374151':'background:transparent;color:#6b7280;border:1px solid transparent'}">💰 Income (${incCount})</button>

    ${modal}`;
}

function renderDashboard() {
  // Empty state for brand new users
  if (!state.accounts.length && !state.transactions.length) {
    return `
      ${renderNav()}

          <button onclick="setView('accounts')" style="padding:14px;border-radius:12px;background:#6366f1;border:none;color:#fff;font-size:14px;font-weight:600;cursor:pointer">🏦 Add My Accounts</button>

        </div>
        <div id="import-panel" style="display:none;margin-top:24px;background:#1d2027;border:1px solid #374151;border-radius:16px;padding:20px;text-align:left">
          <div style="font-weight:600;margin-bottom:4px;color:#e5e7eb">Import Your Data</div>
          <div style="color:#6b7280;font-size:12px;margin-bottom:16px">CSV is the easiest — works from Excel, Google Sheets, or any app</div>
          <div style="display:flex;flex-direction:column;gap:10px">
            <button onclick="importCSV()" style="padding:12px 14px;border-radius:10px;background:#6366f1;border:none;color:#fff;font-size:13px;cursor:pointer;text-align:left;font-weight:600">
              📊 Import Transactions from CSV
            </button>
            <button onclick="importData()" style="padding:12px 14px;border-radius:10px;background:#0f1116;border:1px solid #374151;color:#d1d5db;font-size:13px;cursor:pointer;text-align:left">
              🗂 Restore from JSON Backup
            </button>
          </div>
          <div id="import-status" style="margin-top:12px;font-size:13px"></div>
          <details style="margin-top:16px">
            <summary style="color:#6b7280;font-size:12px;cursor:pointer;user-select:none">📋 CSV Format Guide</summary>
            <div style="margin-top:10px;background:#0f1116;border-radius:8px;padding:12px;font-size:11px;color:#9ca3af;font-family:monospace;overflow-x:auto;white-space:nowrap">
              Date,Description,Type,Amount,Category,Subcategory,Account,Notes<br>
              2026-05-01,Jollibee,expense,150,Food,Fast Food,GCash,Lunch<br>
              2026-05-07,Upwork,income,50000,Freelance,Upwork,Unionbank,<br>
              2026-06-01,Rent,expense,22000,Housing,,Unionbank,June rent
            </div>
            <div style="margin-top:10px;color:#6b7280;font-size:11px;line-height:1.7">
              <strong style="color:#9ca3af">Required:</strong> Date (YYYY-MM-DD), Description, Type (expense/income/transfer), Amount<br>
              <strong style="color:#9ca3af">Optional:</strong> Category, Subcategory, Account, Notes<br>
              <strong style="color:#9ca3af">Tip:</strong> Category and Account names must match what you set up in this app
            </div>
          </details>
        </div>
      </div>`;
  }

  const nw=netWorth(), assets=totalAssets(), spendable=spendableAssets(), liab=totalLiab();
  const m=getMonthlyData();
  const net=m.income-m.expenses;
  const incomeW=Math.min((m.income/Math.max(m.income,m.expenses))*100,100);
  const expW=Math.min((m.expenses/Math.max(m.income,m.expenses))*100,100);
  // Auto-compute avg monthly expenses from last 3 months of actual transactions
  const autoAvgExp = (() => {
    const months = [];
    for (let i=1; i<=3; i++) {
      const mo = (now.getMonth()-i+12)%12, yr = now.getMonth()-i<0?now.getFullYear()-1:now.getFullYear();
      const sum = (state.transactions||[]).filter(t=>{ const d=new Date(t.date+'T00:00:00'); return t.type==='expense'&&d.getFullYear()===yr&&d.getMonth()===mo; }).reduce((s,t)=>s+t.amount,0);
      if (sum>0) months.push(sum);
    }
    return months.length>0 ? months.reduce((a,b)=>a+b,0)/months.length : (m.avgMonthlyExpenses||0);
  })();
  const dailyBurn = autoAvgExp/30;
  const runway = dailyBurn>0 ? Math.floor(spendable/dailyBurn) : 0;
  const savingsRate=m.income>0?((net/m.income)*100).toFixed(1):0;
  const maxCat=Math.max(...m.categories.map(c=>c.amount),1);
  const forecastEnd=new Date(now.getTime()+(state.forecastDays||7)*24*60*60*1000).toISOString().split('T')[0];
  const forecastItems={
    income: (state.recurring||[]).filter(r=>r.type==='income' &&r.active&&r.nextDue<=forecastEnd),
    expense:(state.recurring||[]).filter(r=>r.type==='expense'&&r.active&&r.nextDue<=forecastEnd),
  };
  const forecastIncome=forecastItems.income.reduce((s,r)=>s+r.amount,0);
  const forecastExpense=forecastItems.expense.reduce((s,r)=>s+r.amount,0);
  // Also include CC due payments in forecast expenses
  const ccForecastExp = (state.creditCards||[]).filter(c=>{
    const due = new Date(now.getFullYear(),now.getMonth(),c.dueDay).toISOString().split('T')[0];
    return due>=todayISO&&due<=forecastEnd&&c.outstanding>0;
  }).reduce((s,c)=>s+c.outstanding,0);
  const available=spendable+forecastIncome-forecastExpense-ccForecastExp;
  // Compute vs Last Month dynamically
  const curMo=now.getMonth(), curYr=now.getFullYear();
  const prevMo=curMo===0?11:curMo-1, prevYr=curMo===0?curYr-1:curYr;
  const lastMoExp=state.transactions.filter(t=>{const d=new Date(t.date+'T00:00:00');return t.type==='expense'&&d.getFullYear()===prevYr&&d.getMonth()===prevMo;}).reduce((s,t)=>s+t.amount,0);
  const vsLastMo = lastMoExp>0 ? (((m.expenses-lastMoExp)/lastMoExp)*100).toFixed(0) : null;
  const vsLastMoLabel = vsLastMo===null ? '—' : (vsLastMo>=0?`↑ ${vsLastMo}%`:`↓ ${Math.abs(vsLastMo)}%`);
  const vsLastMoColor = vsLastMo===null ? 'text-gray-400' : (vsLastMo>=0 ? 'text-red-400' : 'text-emerald-400');

  return `${renderNav()}
    <div class="rounded-2xl p-6 mb-6" style="background:linear-gradient(135deg,#4338ca 0%,#6366f1 100%)">
      <div class="text-sm opacity-75 mb-1">Net worth</div>
      <div class="text-5xl font-bold tracking-tight mb-5">${fmt2(nw)}</div>
      <div class="flex gap-10">
        <div><div class="text-xs opacity-60 mb-0.5">Assets</div><div class="text-lg font-semibold">${fmt2(assets)}</div></div>
        <div><div class="text-xs opacity-60 mb-0.5">Liabilities</div><div class="text-lg font-semibold">${fmt2(liab)}</div></div>
      </div>
    </div>
    <div class="flex items-center justify-between mb-3"><div class="section-label">DEBIT ACCOUNTS</div><div class="text-xs text-emerald-400 font-medium">${fmt2(assets)}</div></div>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-3">
      ${state.accounts.map(a=>`<div class="bg-[#1d2027] rounded-xl p-4"><div class="text-xs text-gray-400 mb-2">${a.name}</div><div class="text-lg font-semibold">${editable(a.balance,`accounts.${a.id}.balance`,fmt)}</div></div>`).join('')}
    </div>
    <div class="flex items-center justify-between mb-3 mt-6"><div class="section-label">CREDIT CARDS</div><div class="text-xs text-red-400 font-medium">OWED ${fmt2(liab)}</div></div>
    <div class="space-y-3 mb-7">
      ${state.creditCards.map(c=>{
        const avail=c.limit-c.outstanding, pct=c.limit>0?Math.min((c.outstanding/c.limit)*100,100):0;
        return `<div class="bg-[#1d2027] rounded-xl p-4">
          <div class="flex justify-between items-start mb-3">
            <div><div class="font-medium">${c.name}</div><div class="text-xs text-gray-500 mt-0.5">Due ${c.dueDay}${sfx(c.dueDay)} · ${daysUntil(c.dueDay)} days away</div></div>
            <div class="text-right"><div class="text-red-400 font-semibold">${fmt2(c.outstanding)}</div><div class="text-xs text-gray-500">avl. ${fmt2(avail)}</div></div>
          </div>
          <div class="bg-[#0f1116] rounded-full overflow-hidden" style="height:3px"><div style="width:${pct}%;height:3px;background:#ef4444;border-radius:2px"></div></div>
        </div>`;}).join('')}
    </div>
    <div class="bg-[#1d2027] rounded-2xl p-5 mb-4">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2"><span>📊</span><span class="font-semibold">${m.label}</span></div>
        <div class="text-xs px-2.5 py-1 rounded-full font-semibold ${net>=0?'bg-emerald-900/40 text-emerald-400':'bg-red-900/40 text-red-400'}">${net>=0?'+':''}${fmt(net)}</div>
      </div>
      <div class="space-y-3">
        <div>
          <div class="flex justify-between text-sm mb-1.5"><span class="text-gray-400">Income</span><span class="text-emerald-400 font-medium">${fmt2(m.income)}</span></div>
          <div class="bg-[#0f1116] rounded-full overflow-hidden" style="height:6px"><div style="width:${incomeW}%;height:6px;background:linear-gradient(90deg,#10b981,#34d399);border-radius:3px"></div></div>
        </div>
        <div>
          <div class="flex justify-between text-sm mb-1.5"><span class="text-gray-400">Expenses</span><span class="text-red-400 font-medium">${fmt2(m.expenses)}</span></div>
          <div class="bg-[#0f1116] rounded-full overflow-hidden" style="height:6px"><div style="width:${expW}%;height:6px;background:linear-gradient(90deg,#ef4444,#f87171);border-radius:3px"></div></div>
        </div>
      </div>
      <div class="flex gap-4 mt-4 pt-4 border-t border-gray-800">
        <div class="flex-1 text-center"><div class="text-xs text-gray-500 mb-0.5">Net Income</div><div class="font-bold ${net>=0?'text-emerald-400':'text-red-400'}">${fmt(net)}</div></div>
        <div class="flex-1 text-center border-l border-gray-800"><div class="text-xs text-gray-500 mb-0.5">Savings Rate</div><div class="font-bold ${savingsRate>=20?'text-emerald-400':'text-amber-400'}">${savingsRate}%</div></div>
        <div class="flex-1 text-center border-l border-gray-800"><div class="text-xs text-gray-500 mb-0.5">vs Last Month</div><div class="font-bold ${vsLastMoColor}">${vsLastMoLabel}</div></div>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="bg-[#1d2027] rounded-2xl p-5">
        <div class="text-xs text-gray-500 mb-1">🔥 Daily Burn Rate</div>
        <div class="text-2xl font-bold">${fmt(dailyBurn)}</div>
        <div class="text-xs text-gray-600 mt-1">per day</div>
        <div class="mt-3 pt-3 border-t border-gray-800"><div class="text-xs text-gray-500">3-mo avg spend</div><div class="text-sm font-medium mt-0.5">${fmt(autoAvgExp)}</div></div>
      </div>
      <div class="bg-[#1d2027] rounded-2xl p-5">
        <div class="text-xs text-gray-500 mb-1">⏱️ Cash Runway</div>
        <div class="text-2xl font-bold ${runway<14?'text-red-400':runway<30?'text-amber-400':'text-emerald-400'}">${runway}</div>
        <div class="text-xs text-gray-600 mt-1">days remaining</div>
        <div class="mt-3 pt-3 border-t border-gray-800"><div class="text-xs ${runway<14?'text-red-400':runway<30?'text-amber-400':'text-gray-500'}">${runway<14?'⚠️ Income needed soon':runway<30?'Moderate cushion':'Good buffer'}</div></div>
      </div>
    </div>
    <div class="bg-[#1d2027] rounded-2xl p-5 mb-4">
      <div class="flex items-center gap-2 mb-4"><span>🏆</span><span class="font-semibold">Top Spending — ${m.label}</span></div>
      <div class="space-y-3">
        ${m.categories.map((c,i)=>{
          const pct=(c.amount/maxCat)*100;
          return `<div>
            <div class="flex justify-between items-center mb-1.5">
              <div class="flex items-center gap-2 text-sm"><span class="text-base">${c.icon}</span><span>${c.name}</span><span class="text-xs text-gray-600">#${i+1}</span></div>
              <span class="text-sm font-medium">${fmt(c.amount)}</span>
            </div>
            <div class="bg-[#0f1116] rounded-full overflow-hidden" style="height:5px"><div style="width:${pct}%;height:5px;background:${c.color};border-radius:3px;opacity:0.85"></div></div>
          </div>`;}).join('')}
      </div>
    </div>
    <div class="bg-[#1d2027] rounded-2xl p-5 mb-4">
      <div class="flex items-center gap-2 mb-4"><span>🪙</span><span class="font-semibold">Spending Forecast</span></div>
      <div class="flex gap-2 mb-5 flex-wrap">

// RENDER RECURRING
// ═══════════════════════════════════════════════════════
function renderRecurring() {
  const FREQ = { daily:'Daily', weekly:'Weekly', biweekly:'Bi-weekly', monthly:'Monthly', quarterly:'Quarterly', yearly:'Yearly' };
  const FREQ_MO = { daily:30.4, weekly:4.33, biweekly:2.17, monthly:1, quarterly:0.333, yearly:0.0833 };
  const recs = state.recurring || [];
  const active = recs.filter(r=>r.active);
  const monthlyExp = active.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount*(FREQ_MO[r.frequency]||1),0);
  const monthlyInc = active.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount*(FREQ_MO[r.frequency]||1),0);

  const sorted = [...recs].sort((a,b)=>{
    const sc=x=>{ if(!x.active) return 10; if(x.nextDue<todayISO) return 0; if(x.nextDue===todayISO) return 1; return 2; };
    const d=sc(a)-sc(b); return d!==0?d:a.nextDue.localeCompare(b.nextDue);
  });

  function recModal(r) {
    const isEdit=!!r, pfx=isEdit?'edit-':'', title=isEdit?'Edit Recurring':'Add Recurring';
    const onClose=isEdit?'recCancelEdit()':'recCloseAdd()';
    const onSave=isEdit?`recUpdate('${r.id}')`:'recSave()';
    const errId=isEdit?'':'rec-err';
    const cats=state.categories.filter(c=>c.active);
    const selCat=r?.categoryId||'';
    const selSub=r?.subcategoryId||'';
    const subs=selCat?(cats.find(c=>c.id===selCat)?.subs||[]).filter(s=>s.active):[];
    return `
      <div class="fixed inset-0 flex items-end sm:items-center justify-center" style="z-index:200;background:rgba(0,0,0,0.8)" onclick="${onClose}">
        <div class="w-full sm:w-96 rounded-t-3xl sm:rounded-2xl p-6" style="background:#1d2027;border:1px solid #374151;max-height:92vh;overflow-y:auto" onclick="event.stopPropagation()">
          <div class="flex items-center justify-between mb-5">
            <div class="text-lg font-bold">${title}</div>
            <button onclick="${onClose}" style="background:none;border:none;color:#6b7280;cursor:pointer;font-size:22px;line-height:1">×</button>
          </div>
          <div class="grid gap-3 mb-3" style="grid-template-columns:56px 1fr">
            <div><div class="field-label">ICON</div><input type="hidden" id="${pfx}rec-icon" value="${r?r.icon||'🔁':'🔁'}">
              <button type="button" onclick="iconPickerOpen('${pfx}rec-icon','rec')" id="${pfx}rec-icon-btn" onmouseover="this.style.borderColor='#6366f1'" onmouseout="this.style.borderColor='#374151'" style="width:100%;height:44px;background:#0f1116;border:1px solid #374151;border-radius:10px;font-size:24px;cursor:pointer;line-height:1;transition:border-color 0.15s">${r?r.icon||'🔁':'🔁'}</button></div>
            <div><div class="field-label">NAME *</div><input id="${pfx}rec-name" type="text" ${r?`value="${r.name}"`:'placeholder="e.g. Rent"'} class="field-input"></div>
          </div>
          <div class="grid grid-cols-2 gap-3 mb-3">
            <div><div class="field-label">TYPE</div>
              <select id="${pfx}rec-type" class="field-select">
                <option value="expense" ${r?.type==='expense'||!r?'selected':''}>💸 Expense</option>
                <option value="income"  ${r?.type==='income'?'selected':''}>💰 Income</option>
              </select>
            </div>
            <div><div class="field-label">FREQUENCY</div>
              <select id="${pfx}rec-freq" class="field-select">
                ${Object.entries(FREQ).map(([v,l])=>`<option value="${v}" ${r?.frequency===v?'selected':''}>${l}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-3 mb-3">
            <div><div class="field-label">AMOUNT (₱) *</div><input id="${pfx}rec-amount" type="number" step="0.01" min="0" ${r?`value="${r.amount}"`:'placeholder="0.00"'} class="field-input"></div>
            <div><div class="field-label">NEXT DUE DATE</div><input id="${pfx}rec-due" type="date" value="${r?.nextDue||todayISO}" class="field-input"></div>
          </div>
          <div class="mb-3"><div class="field-label">CATEGORY (optional)</div>
            <select id="${pfx}rec-cat" class="field-select" onchange="recUpdateSub('${pfx}rec-cat','${pfx}rec-subcat')">
              <option value="">— None —</option>
              ${cats.map(c=>`<option value="${c.id}" ${selCat===c.id?'selected':''}>${c.icon} ${c.name}</option>`).join('')}
            </select>
          </div>
          <div class="mb-3"><div class="field-label">SUBCATEGORY (optional)</div>
            <select id="${pfx}rec-subcat" class="field-select">
              <option value="">— All —</option>
              ${subs.map(s=>`<option value="${s.id}" ${selSub===s.id?'selected':''}>${s.name}</option>`).join('')}
            </select>
          </div>
          <div class="mb-5"><div class="field-label">ACCOUNT (optional)</div>
            <select id="${pfx}rec-acct" class="field-select">
              <option value="">— None —</option>
              <optgroup label="── Debit / Cash ──">
                ${state.accounts.map(a=>`<option value="${a.id}" ${r?.accountId===a.id?'selected':''}>${a.icon||''} ${a.name}</option>`).join('')}
              </optgroup>
              ${state.creditCards.length?`<optgroup label="── Credit Cards ──">${state.creditCards.map(c=>`<option value="${c.id}" ${r?.accountId===c.id?'selected':''}>${c.icon||'💳'} ${c.name} (CC)</option>`).join('')}</optgroup>`:''}
            </select>
          </div>
          ${errId?`<div id="${errId}" class="text-red-400 text-xs mb-3"></div>`:''}
          <div class="flex gap-3">
            <button onclick="${onSave}" class="flex-1 rounded-xl py-3 font-semibold text-white text-sm" style="background:#6366f1;border:none;cursor:pointer">${isEdit?'Save Changes':'Add Recurring'}</button>
            <button onclick="${onClose}" class="flex-1 rounded-xl py-3 text-sm" style="background:#0f1116;border:1px solid #374151;color:#9ca3af;cursor:pointer">Cancel</button>
          </div>
        </div>
      </div>`;
  }

  function recCard(r) {
    const cat=r.categoryId?state.categories.find(c=>c.id===r.categoryId):null;
    const sub=cat&&r.subcategoryId?cat.subs.find(s=>s.id===r.subcategoryId):null;
    const acct=r.accountId?findAccount(r.accountId):null;
    const isOverdue=r.nextDue<todayISO, isDueToday=r.nextDue===todayISO;
    const typeColor=r.type==='income'?'#34d399':'#f87171';
    const typeBg=r.type==='income'?'rgba(52,211,153,0.12)':'rgba(248,113,113,0.12)';

    if (recUI.deleteRecId===r.id) return `
      <div class="rounded-2xl p-4 mb-3" style="background:#1d2027;border:1px solid #7f1d1d">
        <div class="text-sm mb-3" style="color:#fca5a5">Delete <strong>${r.icon} ${r.name}</strong>? Cannot be undone.</div>
        <div class="flex gap-2">
          <button onclick="recConfirmDelete()" class="rounded-lg px-5 py-2 text-sm font-semibold" style="background:#ef4444;border:none;color:#fff;cursor:pointer">Delete</button>
          <button onclick="recCancelDelete()" class="rounded-lg px-5 py-2 text-sm" style="background:#374151;border:none;color:#9ca3af;cursor:pointer">Cancel</button>
        </div>
      </div>`;

    return `
      <div class="rounded-2xl p-4 mb-3" style="background:#1d2027;${!r.active?'opacity:0.6':''}">
        <div class="flex items-start justify-between mb-3">
          <div class="flex items-center gap-3">
            <div class="flex-shrink-0 flex items-center justify-center rounded-xl text-xl" style="width:42px;height:42px;background:${typeBg}">${r.icon||'🔁'}</div>
            <div>
              <div class="font-semibold text-sm" style="color:#e5e7eb">${r.name}</div>
              <div class="flex items-center gap-2 mt-1 flex-wrap">
                <span class="text-xs px-2 py-0.5 rounded-full font-medium" style="background:${typeBg};color:${typeColor}">${r.type==='income'?'💰 Income':'💸 Expense'}</span>
                <span class="text-xs px-2 py-0.5 rounded-full" style="background:#0f1116;color:#9ca3af">${FREQ[r.frequency]||r.frequency}</span>
                ${!r.active?`<span class="text-xs px-2 py-0.5 rounded-full" style="background:#374151;color:#9ca3af">⏸ Paused</span>`:''}
                ${isOverdue&&r.active?`<span class="text-xs px-2 py-0.5 rounded-full font-semibold" style="background:rgba(248,113,113,0.15);color:#f87171">⚠️ Overdue</span>`:''}
                ${isDueToday?`<span class="text-xs px-2 py-0.5 rounded-full font-semibold" style="background:rgba(251,191,36,0.15);color:#fbbf24">⚡ Due today</span>`:''}
              </div>
            </div>
          </div>
          <div class="text-right flex-shrink-0 ml-2">
            <div class="font-bold text-sm" style="color:${typeColor}">${r.type==='income'?'+':'-'}${fmt2(r.amount)}</div>
            <div class="flex gap-1 mt-1 justify-end">
              <button onclick="recToggleActive('${r.id}')" title="${r.active?'Pause':'Resume'}" style="background:#0f1116;border:none;color:#9ca3af;cursor:pointer;border-radius:8px;padding:5px 7px;font-size:13px">${r.active?'⏸':'▶'}</button>
              <button onclick="recDuplicate('${r.id}')" title="Duplicate" style="background:#0f1116;border:none;color:#9ca3af;cursor:pointer;border-radius:8px;padding:5px 7px;font-size:13px">⧉</button>
              <button onclick="recOpenEdit('${r.id}')" style="background:#0f1116;border:none;color:#9ca3af;cursor:pointer;border-radius:8px;padding:5px 7px;font-size:13px">✏️</button>
              <button onclick="recAskDelete('${r.id}')" style="background:#0f1116;border:none;color:#9ca3af;cursor:pointer;border-radius:8px;padding:5px 7px;font-size:13px">🗑️</button>
            </div>
          </div>
        </div>
        <div class="flex items-center gap-4 text-xs flex-wrap" style="color:#6b7280">
          <span style="color:${isOverdue?'#f87171':isDueToday?'#fbbf24':'#6b7280'}">📅 ${isOverdue?'Overdue · ':isDueToday?'Today · ':'Next: '}${fmtDate(r.nextDue)}</span>
          ${cat?`<span>${cat.icon} ${cat.name}${sub?' › '+sub.name:''}</span>`:''}
          ${acct?`<span>${acct.icon||'💳'} ${acct.name}</span>`:''}
        </div>
      </div>`;
  }

  const editRec = recUI.editRecId ? recs.find(r=>r.id===recUI.editRecId) : null;

  return `${renderNav()}
    <div class="flex items-center justify-between mb-1">
      <div class="text-2xl font-bold">Recurring</div>
      <button onclick="recOpenAdd()" class="rounded-xl px-4 py-2.5 text-sm font-semibold text-white flex-shrink-0" style="background:#6366f1;border:none;cursor:pointer">+ Add</button>
    </div>
    <div class="section-label mb-4">${recs.length} item${recs.length!==1?'s':''} · ${active.length} active</div>

    ${recAutoPostedCount>0?`
    <div class="flex items-center gap-3 rounded-xl p-3 mb-4 text-sm" style="background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.2)">
      <span>⚡</span>
      <span style="color:#6ee7b7"><strong>${recAutoPostedCount} transaction${recAutoPostedCount>1?'s':''}</strong> were auto-posted since your last visit</span>
    </div>`:''}

    <div class="grid grid-cols-2 gap-3 mb-5">
      <div class="rounded-2xl p-4" style="background:#1d2027">
        <div class="text-xs mb-1" style="color:#6b7280">Monthly Expenses</div>
        <div class="text-xl font-bold text-red-400">-${fmt2(monthlyExp)}</div>
        <div class="text-xs mt-0.5" style="color:#4b5563">${active.filter(r=>r.type==='expense').length} items</div>
      </div>
      <div class="rounded-2xl p-4" style="background:#1d2027">
        <div class="text-xs mb-1" style="color:#6b7280">Monthly Income</div>
        <div class="text-xl font-bold text-emerald-400">+${fmt2(monthlyInc)}</div>
        <div class="text-xs mt-0.5" style="color:#4b5563">${active.filter(r=>r.type==='income').length} items</div>
      </div>
    </div>

    ${recs.length===0?`
      <div class="flex flex-col items-center justify-center py-20 text-center">
        <div class="text-5xl mb-4">🔁</div>
        <div class="text-xl font-bold mb-2">No recurring items</div>
        <div class="text-sm max-w-xs mb-5" style="color:#6b7280">Add your regular bills, salaries, and income so they post automatically.</div>
        <button onclick="recOpenAdd()" class="rounded-xl px-6 py-3 text-sm font-semibold text-white" style="background:#6366f1;border:none;cursor:pointer">+ Add your first item</button>
      </div>`:sorted.map(r=>recCard(r)).join('')}

    ${recUI.showAddRec ? recModal(null) : ''}
    ${editRec ? recModal(editRec) : ''}`;
}


function renderGoals() {
  function goalCard(g) {
    const gs=computeGoalSaved(g);
    const remaining=Math.max(g.target-gs.total,0);
    const months=monthsBetween(g.targetDate);
    const monthly=months>0?remaining/months:remaining, daily=monthly/30;
    const pct=g.target>0?Math.min((gs.total/g.target)*100,100):0;
    const barColor=pct>=66?'linear-gradient(90deg,#10b981,#34d399)':pct>=33?'linear-gradient(90deg,#f59e0b,#fbbf24)':'linear-gradient(90deg,#6366f1,#818cf8)';
    const pctColor=pct>=66?'#34d399':pct>=33?'#fbbf24':'#818cf8';
    const dateLabel=new Date(g.targetDate).toLocaleDateString('en-US',{month:'short',year:'numeric'});
    const deposits=g.deposits||[];
    const isDepositOpen=goalUI.depositGoalId===g.id;
    const isHistoryOpen=goalUI.expandedGoalId===g.id;

          <button onclick="goalConfirmDelete()" class="rounded-lg px-5 py-2 text-sm font-semibold" style="background:#ef4444;border:none;color:#fff;cursor:pointer">Delete Goal</button>
          <button onclick="goalCancelDelete()" class="rounded-lg px-5 py-2 text-sm" style="background:#374151;border:none;color:#9ca3af;cursor:pointer">Cancel</button>

      </div>`;

          <div><div class="field-label">DATE</div><input id="dep-date-${g.id}" type="date" value="${todayISO}" class="field-input"></div>

          <button onclick="goalCloseDeposit()" class="flex-1 rounded-xl py-2.5 text-sm" style="background:#374151;border:none;color:#9ca3af;cursor:pointer">Cancel</button>
        </div>
      </div>`:'';

          <div class="flex-1 text-xs" style="color:#fca5a5">Remove ${fmt(d.amount)} deposit?</div>
          <button onclick="goalConfirmDeleteDeposit()" class="text-xs px-3 py-1 rounded-lg" style="background:#ef4444;border:none;color:#fff;cursor:pointer">Remove</button>

function renderAccounts() {
  const TC = {
    bank:    { label:'Bank',     icon:'🏦', color:'#3b82f6', bg:'rgba(59,130,246,0.13)'  },
    ewallet: { label:'E-Wallet', icon:'📱', color:'#8b5cf6', bg:'rgba(139,92,246,0.13)'  },
    cash:    { label:'Cash',     icon:'💵', color:'#10b981', bg:'rgba(16,185,129,0.13)'  },
  };
  const banks    = state.accounts.filter(a=>(a.type||'bank')==='bank');
  const ewallets = state.accounts.filter(a=>a.type==='ewallet');
  const cashList = state.accounts.filter(a=>a.type==='cash');
  const sumB=banks.reduce((s,a)=>s+a.balance,0), sumE=ewallets.reduce((s,a)=>s+a.balance,0), sumC=cashList.reduce((s,a)=>s+a.balance,0);
  const totalDebit=sumB+sumE+sumC, totalOwed=state.creditCards.reduce((s,c)=>s+c.outstanding,0), nw=totalDebit-totalOwed;
  const totalMaintaining=state.accounts.reduce((s,a)=>s+(a.maintainingBalance||0),0);

// ── Simple CSV parser (handles quoted fields) ──
function parseCSV(text) {
  const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(l=>l.trim());
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h=>h.trim().toLowerCase().replace(/^"|"$/g,''));
  return lines.slice(1).map(line => {
    const vals = []; let cur='', inQ=false;
    for (let i=0;i<line.length;i++) {
      const ch=line[i];
      if (ch==='"' && !inQ) { inQ=true; continue; }
      if (ch==='"' && inQ && line[i+1]==='"') { cur+='"'; i++; continue; }
      if (ch==='"' && inQ) { inQ=false; continue; }
      if (ch===',' && !inQ) { vals.push(cur.trim()); cur=''; continue; }
      cur+=ch;
    }
    vals.push(cur.trim());
    const row={};
    headers.forEach((h,i)=>{ row[h]=vals[i]||''; });
    return row;
  });
}

// ── Import from CSV file ──
window.importCSV = () => {
  const input = document.createElement('input');
  input.type='file'; input.accept='.csv,text/csv';
  input.onchange = e => {
    const file=e.target.files[0]; if (!file) return;
    const reader=new FileReader();
    reader.onload = ev => {
      try {
        const rows = parseCSV(ev.target.result);
        if (!rows.length) { setImportStatus('✗ File is empty or has no data rows.','#f87171'); return; }
        // Validate required columns
        const required = ['date','description','type','amount'];
        const missing  = required.filter(h=>!(h in rows[0]));
        if (missing.length) { setImportStatus(`✗ Missing columns: ${missing.join(', ')}. See format guide below.`,'#f87171'); return; }

        let added=0, skipped=0;
        rows.forEach(row => {
          const date   = row['date']?.trim();
          const desc   = row['description']?.trim();
          const type   = (row['type']?.trim()||'expense').toLowerCase();
          const amount = parseFloat(row['amount']?.replace(/[^0-9.]/g,''));
          if (!date||!desc||isNaN(amount)||amount<=0) { skipped++; return; }
          if (!['expense','income','transfer'].includes(type)) { skipped++; return; }

          // Match category by name (case-insensitive)
          const catName = row['category']?.trim().toLowerCase();
          const subName = row['subcategory']?.trim().toLowerCase();
          const cat     = catName ? state.categories.find(c=>c.name.toLowerCase()===catName) : null;
          const subcat  = (cat&&subName) ? cat.subs?.find(s=>s.name.toLowerCase()===subName) : null;

          // Match account by name (case-insensitive), fallback to first account
          const acctName = row['account']?.trim().toLowerCase();
          const acct     = acctName ? state.accounts.find(a=>a.name.toLowerCase()===acctName) : null;
          const accountId= acct?.id || state.accounts[0]?.id || '';

          state.transactions.push({
            id:'tx_csv_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
            date, description:desc, type, amount,
            categoryId:cat?.id||'', subcategoryId:subcat?.id||'',
            accountId, toAccountId:'', notes:row['notes']?.trim()||''
          });
          added++;
        });

        if (added===0) { setImportStatus(`✗ No valid rows found. Check your column names and values.`,'#f87171'); return; }
        save();
        setImportStatus(`✓ Imported ${added} transactions${skipped?` (${skipped} skipped — invalid rows)`:''}.`,'#34d399');
        setTimeout(()=>{ currentView='transactions'; render(); }, 1500);
      } catch(err) {
        setImportStatus('✗ Could not parse file. Make sure it is a valid CSV.','#f87171');
      }
    };
    reader.readAsText(file);
  };
  input.click();
};

// ── Import full backup from JSON ──
window.importData = () => {
  const input = document.createElement('input');
  input.type='file'; input.accept='.json,application/json';
  input.onchange = e => {
    const file=e.target.files[0]; if (!file) return;
    const reader=new FileReader();
    reader.onload = async ev => {
      try {
        state = migrateState(JSON.parse(ev.target.result));
        save();
        setImportStatus('✓ Backup restored successfully!','#34d399');
        setTimeout(()=>render(), 1200);
      } catch(err) { setImportStatus('✗ Invalid file.','#f87171'); }
    };
    reader.readAsText(file);
  };
  input.click();
};

function setImportStatus(msg, color) {
  const el = document.getElementById('import-status');
  if (el) { el.textContent=msg; el.style.color=color||'#34d399'; }
}



function showSyncIndicator(msg) {
  let el = document.getElementById('sync-indicator');
  if (!el) return;
  el.textContent = msg;
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 2500);
}

async function loadFromSupabase(user) {
  const lsKey = STORAGE_KEY + '_' + user.id;
  try {
    const { data, error } = await sb.from('finance_state').select('state').eq('user_id', user.id).single();
    if (data?.state && Object.keys(data.state).length > 0) {
      // Existing user — load their data
      state = migrateState(data.state);
      try { localStorage.setItem(lsKey, JSON.stringify(state)); } catch(e) {}
    } else {
      // Brand new user — start with a clean empty state
      state = JSON.parse(JSON.stringify(defaultState));
      // Save their fresh state to Supabase so they have a row
      try {
        await sb.from('finance_state').upsert({
          user_id: user.id, state, updated_at: new Date().toISOString()
        }, { onConflict: 'user_id' });
      } catch(e) {}
    }
  } catch(e) {
    // Offline — try this user's localStorage cache
    try {
      const cached = localStorage.getItem(lsKey);
      if (cached) state = migrateState(JSON.parse(cached));
      else state = JSON.parse(JSON.stringify(defaultState));
    } catch(e2) { state = JSON.parse(JSON.stringify(defaultState)); }
  }
}

window.signInWithGoogle = async () => {
  // Detect in-app browsers (Messenger, Instagram, Facebook, TikTok, etc.)
  const ua = navigator.userAgent || '';
  const isInApp = /FBAN|FBAV|Instagram|Messenger|Line|Twitter|TikTok|MicroMessenger/i.test(ua);
  if (isInApp) {
    document.getElementById('inapp-warning').style.display = '';
    return;
  }
  const btn = document.getElementById('google-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Redirecting...'; }
  // Use clean origin URL — avoids hash/query param issues that cause Google 400
  const redirectTo = window.location.origin + window.location.pathname;
  await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo }
  });
};

window.signOut = async () => {
  const lsKey = currentUser ? STORAGE_KEY + '_' + currentUser.id : STORAGE_KEY;
  await sb.auth.signOut();
  state = JSON.parse(JSON.stringify(defaultState));
  try { localStorage.removeItem(lsKey); } catch(e) {}
  currentUser = null;
  render();
};

async function initAuth() {
  const { data: { session } } = await sb.auth.getSession();
  currentUser = session?.user || null;
  if (currentUser) {
    await loadFromSupabase(currentUser);
    checkAndPostRecurring();
  }
  isLoading = false;
  render();

  sb.auth.onAuthStateChange(async (event, session) => {
    const wasLoggedIn = !!currentUser;
    currentUser = session?.user || null;
    if (event === 'SIGNED_IN' && !wasLoggedIn) {
      await loadFromSupabase(currentUser);
      checkAndPostRecurring();
    }
    render();
  });

  // Re-sync when tab regains focus (catches edits made on another device)
  document.addEventListener('visibilitychange', async () => {
    if (!document.hidden && currentUser) {
      await loadFromSupabase(currentUser);
      render();
    }
  });
}

initAuth();
