const fmt2 = n => '₱' + n.toLocaleString('en-PH', {minimumFractionDigits:2, maximumFractionDigits:2});

function daysUntil(dueDay) {
  const d = now.getDate();
  if (dueDay >= d) return dueDay - d;
  const next = new Date(now.getFullYear(), now.getMonth()+1, dueDay);
  return Math.ceil((next - now)/(1000*60*60*24));
}
function monthsBetween(ds) {
  const t = new Date(ds);
  return Math.max((t.getFullYear()-now.getFullYear())*12+(t.getMonth()-now.getMonth()),0);
}
function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-PH', { month:'short', day:'numeric', year:'numeric' });
}
function fmtDateShort(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-PH', { month:'short', day:'numeric' });
}

// ── Dashboard data: auto-calculate from transactions if available ──
function getMonthlyData() {
  const yr = now.getFullYear(), mo = now.getMonth();
  const monthTx = state.transactions.filter(t => {
    const d = new Date(t.date + 'T00:00:00');
    return d.getFullYear()===yr && d.getMonth()===mo;
  });
  if (monthTx.length === 0) return state.monthly;

  const income   = monthTx.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount, 0);
  const expenses = monthTx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount, 0);

  // Top categories from transactions
  const catMap = {};
  monthTx.filter(t=>t.type==='expense').forEach(t => {
    if (!t.categoryId) return;
    if (!catMap[t.categoryId]) catMap[t.categoryId] = 0;
    catMap[t.categoryId] += t.amount;
  });
  const palette = ['#6366f1','#f59e0b','#10b981','#3b82f6','#ec4899','#8b5cf6','#06b6d4'];
  const topCats = Object.entries(catMap)
    .sort((a,b)=>b[1]-a[1]).slice(0,5)
    .map(([cid,amt],i) => {
      const cat = state.categories.find(c=>c.id===cid);
      return { id:'mc_'+cid, name:cat?.name||'Other', icon:cat?.icon||'❓', amount:Math.round(amt), color:palette[i]||'#6b7280' };
    });

  return { ...state.monthly, income, expenses, categories: topCats.length ? topCats : state.monthly.categories };
}

function editable(value, path, formatter) {
  const disp = (value===0) ? '—' : (formatter?formatter(value):value);
  return `<span class="editable px-1" data-path="${path}" data-val="${value}">${disp}</span>`;
}
function attachEdits() {
  document.querySelectorAll('[data-path]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const path = el.dataset.path;
      const inp = document.createElement('input');
      inp.type='number'; inp.step='0.01'; inp.value=parseFloat(el.dataset.val); inp.className='editable-input';
      el.replaceWith(inp); inp.focus(); inp.select();
      const commit = () => { const v=parseFloat(inp.value); if(!isNaN(v)) setPath(path,v); render(); };
      inp.addEventListener('blur', commit);
      inp.addEventListener('keydown', ev => { if(ev.key==='Enter') commit(); if(ev.key==='Escape') render(); });
    });
  });
}
function setPath(path, val) {
  const [col,...rest] = path.split('.');
  if (col==='accounts') {
    const [id,field]=rest; const item=state.accounts.find(x=>x.id===id); if(item) item[field]=val;
  } else if (col==='creditCards') {
    const [id,field]=rest; const item=state.creditCards.find(x=>x.id===id); if(item) item[field]=val;
  } else if (col==='monthly') {
    const [field,id,prop]=rest;
    if (field==='categories') { const item=state.monthly.categories.find(x=>x.id===id); if(item) item[prop]=val; }
    else state.monthly[field]=val;
  } else if (col==='goals') {
    const [id,field]=rest; const item=state.goals.find(x=>x.id===id); if(item) item[field]=val;
  }
  save();
}

      <div class="rounded-xl p-3 text-center" style="background:#1d2027">
        <div class="section-label mb-1">INCOME</div>
        <div class="font-bold text-emerald-400 text-sm">${fmt(totalIncome)}</div>
      </div>
      <div class="rounded-xl p-3 text-center" style="background:#1d2027">
        <div class="section-label mb-1">EXPENSES</div>
        <div class="font-bold text-red-400 text-sm">${fmt(totalExpense)}</div>
      </div>
      <div class="rounded-xl p-3 text-center" style="background:#1d2027">
        <div class="section-label mb-1">NET</div>
        <div class="font-bold text-sm ${net>=0?'text-emerald-400':'text-red-400'}">${net>=0?'+':''}${fmt(net)}</div>
      </div>
    </div>

    <!-- Filter tabs -->
    <div class="flex gap-2 mb-5 flex-wrap">
      ${filters.map(f=>`
        <button onclick="txSetFilter('${f}')" class="text-xs px-3 py-1.5 rounded-full transition-all"
          style="${txUI.filter===f?'background:#6366f1;color:#fff;border:1px solid #6366f1':'background:#1d2027;color:#9ca3af;border:1px solid #374151'}">
          ${filterLabels[f]}
        </button>`).join('')}
    </div>

    <!-- Transaction list -->
    <div class="rounded-2xl p-4" style="background:#1d2027">
      ${list.length === 0
        ? `<div class="text-center py-12" style="color:#6b7280">
            <div class="text-4xl mb-3">💸</div>
            <div class="font-semibold mb-1" style="color:#9ca3af">No transactions</div>
            <div class="text-sm">Click "+ Add" to log your first one.</div>
          </div>`
        : rowsHTML}
    </div>
    ${modal}`;
}

// ═══════════════════════════════════════════════════════
// RENDER CATEGORIES
// ═══════════════════════════════════════════════════════
function renderCategories() {
  const all=state.categories, filtered=all.filter(c=>c.type===catUI.tab);
  const expCount=all.filter(c=>c.type==='expense').length, incCount=all.filter(c=>c.type==='income').length;
  const activeCount=filtered.filter(c=>c.active).length;
  const cards=filtered.map(cat=>{
    const isExpanded=catUI.expanded===cat.id, activeSubs=cat.subs.filter(s=>s.active).length;
    const toggleBg=cat.active?'#10b981':'#374151', knobLeft=cat.active?'19px':'3px';
    const subsSection=isExpanded?`
      <div style="background:#0f1116;border-top:1px solid #1f2937" class="px-4 pt-3 pb-4 rounded-b-2xl">
        <div class="section-label mb-2.5">SUBCATEGORIES — double-click to rename</div>
        <div class="flex flex-wrap gap-1.5 mb-3">
          ${cat.subs.map(s=>`<span class="chip${s.active?'':' off'}">
            <span id="sub-name-${s.id}" ondblclick="catStartRenameSub('${cat.id}','${s.id}')" style="cursor:text">${s.name}</span>
            <button class="chip-btn" onclick="catToggleSub('${cat.id}','${s.id}')">${s.active?'●':'○'}</button>
            <button class="chip-btn" onclick="catDeleteSub('${cat.id}','${s.id}')">×</button>
          </span>`).join('')}
        </div>
        <div class="flex gap-2 items-center">
          <input id="new-sub-${cat.id}" class="add-sub-input" placeholder="New subcategory…" onkeydown="if(event.key==='Enter')catAddSub('${cat.id}')">
          <button onclick="catAddSub('${cat.id}')" class="text-xs px-3 py-1.5 rounded-full text-white font-semibold" style="background:#6366f1;border:none;cursor:pointer">Add</button>
        </div>
      </div>`:'' ;
    return `<div class="rounded-2xl overflow-hidden" style="background:#1d2027;${cat.active?'':'opacity:0.5'}">
      <div class="flex items-center gap-3 p-4">
        <div id="cat-icon-${cat.id}" onclick="catStartRenameIcon('${cat.id}')" class="flex-shrink-0 flex items-center justify-center rounded-xl text-xl cursor-pointer" style="width:44px;height:44px;background:#0f1116;border:1px solid #1f2937">${cat.icon}</div>
        <div class="flex-1 min-w-0">
          <div id="cat-name-${cat.id}" ondblclick="catStartRenameCategory('${cat.id}')" class="font-semibold text-sm truncate" style="color:#e5e7eb;cursor:text">${cat.name}</div>
          <div class="text-xs mt-0.5" style="color:#6b7280">${activeSubs}/${cat.subs.length} subcategories</div>
        </div>
        <div class="flex items-center gap-3 flex-shrink-0">
          <div class="cat-toggle" onclick="catToggle('${cat.id}')" style="width:38px;height:22px;background:${toggleBg}"><div class="cat-toggle-knob" style="left:${knobLeft}"></div></div>
          <button onclick="catToggleExpand('${cat.id}')" style="background:none;border:none;cursor:pointer;color:#9ca3af;font-size:20px;line-height:1;padding:0;transform:rotate(${isExpanded?'180':'0'}deg);transition:transform 0.2s">⌄</button>
        </div>
      </div>${subsSection}</div>`;
  }).join('');
  const modal=catUI.showModal?`
    <div class="fixed inset-0 z-50 flex items-center justify-center" style="background:rgba(0,0,0,0.8)" onclick="catCloseModal()">
      <div class="rounded-2xl p-7 w-80" style="background:#1d2027;border:1px solid #374151" onclick="event.stopPropagation()">
        <div class="text-lg font-bold mb-1">New ${catUI.tab==='expense'?'Expense':'Income'} Category</div>
        <div class="text-sm mb-5" style="color:#6b7280">Fill in the details below.</div>
        <div class="section-label mb-1.5">EMOJI ICON</div>
        <input id="modal-icon" placeholder="🗂️" class="w-full rounded-xl p-3 mb-4 text-2xl" style="background:#0f1116;border:1px solid #374151;color:#e5e7eb;outline:none;font-family:inherit">
        <div class="section-label mb-1.5">CATEGORY NAME</div>
        <input id="modal-name" placeholder="e.g. Education" onkeydown="if(event.key==='Enter')catAddFromModal();if(event.key==='Escape')catCloseModal()" class="w-full rounded-xl p-3 mb-6" style="background:#0f1116;border:1px solid #374151;color:#e5e7eb;outline:none;font-size:15px;font-family:inherit">
        <div class="flex gap-3">
          <button onclick="catAddFromModal()" class="flex-1 rounded-xl py-3 text-sm font-semibold text-white" style="background:#6366f1;border:none;cursor:pointer">Add Category</button>
          <button onclick="catCloseModal()" class="flex-1 rounded-xl py-3 text-sm" style="background:#0f1116;border:1px solid #374151;color:#9ca3af;cursor:pointer">Cancel</button>
        </div>
      </div>
    </div>`:'' ;
  return `${renderNav()}
    <div class="flex items-start justify-between mb-5">
      <div><div class="text-2xl font-bold mb-1">Categories</div><div class="section-label">${expCount} EXPENSE &middot; ${incCount} INCOME &middot; ${activeCount} ACTIVE IN VIEW</div></div>
      <button onclick="catOpenModal()" class="rounded-xl px-4 py-2.5 text-sm font-semibold text-white flex-shrink-0" style="background:#6366f1;border:none;cursor:pointer">+ Add Category</button>
    </div>
    <div class="flex p-1 rounded-xl mb-5 gap-1" style="background:#0f1116;border:1px solid #1f2937">
      <button onclick="catSetTab('expense')" class="rounded-lg px-5 py-2 text-sm font-medium" style="${catUI.tab==='expense'?'background:#1d2027;color:#e5e7eb;border:1px solid #374151':'background:transparent;color:#6b7280;border:1px solid transparent'}">💸 Expense (${expCount})</button>
      <button onclick="catSetTab('income')" class="rounded-lg px-5 py-2 text-sm font-medium" style="${catUI.tab==='income'?'background:#1d2027;color:#e5e7eb;border:1px solid #374151':'background:transparent;color:#6b7280;border:1px solid transparent'}">💰 Income (${incCount})</button>
    </div>
    <div class="text-xs mb-4 flex flex-wrap gap-x-4 gap-y-1" style="color:#4b5563"><span>💡 Double-click name to rename &nbsp;·&nbsp; Click emoji to change &nbsp;·&nbsp; Toggle to activate/deactivate</span></div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${filtered.length===0?`<div class="col-span-2 text-center py-16" style="color:#6b7280"><div class="text-5xl mb-3">🗂️</div><div class="font-semibold mb-1" style="color:#9ca3af">No categories</div></div>`:cards}</div>
    ${modal}`;
}

// ═══════════════════════════════════════════════════════
// RENDER PLACEHOLDER
// ═══════════════════════════════════════════════════════
function renderPlaceholder(label, icon, note) {
  return `${renderNav()}
    <div class="flex flex-col items-center justify-center py-24 text-center">
      <div class="text-5xl mb-4">${icon}</div>
      <div class="text-xl font-bold mb-2">${label}</div>
      <div class="text-sm max-w-xs" style="color:#6b7280">${note}</div>
      <div class="mt-5 text-xs px-4 py-2 rounded-full" style="color:#4b5563;border:1px solid #1f2937">Coming soon</div>
    </div>`;
}

// ═══════════════════════════════════════════════════════
// RENDER DASHBOARD
// ═══════════════════════════════════════════════════════
function renderDashboard() {
  const nw=netWorth(), assets=totalAssets(), liab=totalLiab();
  const m=getMonthlyData();
  const net=m.income-m.expenses;
  const incomeW=Math.min((m.income/Math.max(m.income,m.expenses))*100,100);
  const expW=Math.min((m.expenses/Math.max(m.income,m.expenses))*100,100);
  const dailyBurn=m.avgMonthlyExpenses/30, runway=Math.floor(assets/dailyBurn);
  const savingsRate=m.income>0?((net/m.income)*100).toFixed(1):0;
  const maxCat=Math.max(...m.categories.map(c=>c.amount),1);
  const forecastItems={
    income: state.recurring.filter(r=>r.type==='income' &&daysUntil(r.dueDay)<=state.forecastDays),
    expense:state.recurring.filter(r=>r.type==='expense'&&daysUntil(r.dueDay)<=state.forecastDays),
  };
  const forecastIncome=forecastItems.income.reduce((s,r)=>s+r.amount,0);
  const forecastExpense=forecastItems.expense.reduce((s,r)=>s+r.amount,0);
  const available=assets+forecastIncome-forecastExpense;

  return `${renderNav()}
    <div class="rounded-2xl p-6 mb-6" style="background:linear-gradient(135deg,#4338ca 0%,#6366f1 100%)">
      <div class="text-sm opacity-75 mb-1">Net worth</div>
      <div class="text-5xl font-bold tracking-tight mb-5">${fmt2(nw)}</div>
      <div class="flex gap-10">
        <div><div class="text-xs opacity-60 mb-0.5">Assets</div><div class="text-lg font-semibold">${fmt2(assets)}</div></div>
        <div><div class="text-xs opacity-60 mb-0.5">Liabilities</div><div class="text-lg font-semibold">${fmt2(liab)}</div></div>
      </div>
    </div>
    <div class="flex items-center justify-between mb-3"><div class="section-label">DEBIT ACCOUNTS</div><div class="text-xs text-emerald-400 font-medium">${fmt2(assets)}</div></div>
    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-3">
      ${state.accounts.map(a=>`<div class="bg-[#1d2027] rounded-xl p-4"><div class="text-xs text-gray-400 mb-2">${a.name}</div><div class="text-lg font-semibold">${editable(a.balance,`accounts.${a.id}.balance`,fmt)}</div></div>`).join('')}
    </div>
    <div class="flex items-center justify-between mb-3 mt-6"><div class="section-label">CREDIT CARDS</div><div class="text-xs text-red-400 font-medium">OWED ${fmt2(liab)}</div></div>
    <div class="space-y-3 mb-7">
      ${state.creditCards.map(c=>{
        const avail=c.limit-c.outstanding, pct=c.limit>0?Math.min((c.outstanding/c.limit)*100,100):0;
        return `<div class="bg-[#1d2027] rounded-xl p-4">
          <div class="flex justify-between items-start mb-3">
            <div><div class="font-medium">${c.name}</div><div class="text-xs text-gray-500 mt-0.5">Due ${c.dueDay}${sfx(c.dueDay)} · ${daysUntil(c.dueDay)} days away</div></div>
            <div class="text-right"><div class="text-red-400 font-semibold">${editable(c.outstanding,`creditCards.${c.id}.outstanding`,fmt2)}</div><div class="text-xs text-gray-500">avl. ${fmt2(avail)}</div></div>
          </div>
          <div class="bg-[#0f1116] rounded-full overflow-hidden" style="height:3px"><div style="width:${pct}%;height:3px;background:#ef4444;border-radius:2px"></div></div>
        </div>`;}).join('')}
    </div>
    <div class="bg-[#1d2027] rounded-2xl p-5 mb-4">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-2"><span>📊</span><span class="font-semibold">${m.label}</span></div>
        <div class="text-xs px-2.5 py-1 rounded-full font-semibold ${net>=0?'bg-emerald-900/40 text-emerald-400':'bg-red-900/40 text-red-400'}">${net>=0?'+':''}${fmt(net)}</div>
      </div>
      <div class="space-y-3">
        <div>
          <div class="flex justify-between text-sm mb-1.5"><span class="text-gray-400">Income</span><span class="text-emerald-400 font-medium">${fmt2(m.income)}</span></div>
          <div class="bg-[#0f1116] rounded-full overflow-hidden" style="height:6px"><div style="width:${incomeW}%;height:6px;background:linear-gradient(90deg,#10b981,#34d399);border-radius:3px"></div></div>
        </div>
        <div>
          <div class="flex justify-between text-sm mb-1.5"><span class="text-gray-400">Expenses</span><span class="text-red-400 font-medium">${fmt2(m.expenses)}</span></div>
          <div class="bg-[#0f1116] rounded-full overflow-hidden" style="height:6px"><div style="width:${expW}%;height:6px;background:linear-gradient(90deg,#ef4444,#f87171);border-radius:3px"></div></div>
        </div>
      </div>
      <div class="flex gap-4 mt-4 pt-4 border-t border-gray-800">
        <div class="flex-1 text-center"><div class="text-xs text-gray-500 mb-0.5">Net Income</div><div class="font-bold ${net>=0?'text-emerald-400':'text-red-400'}">${fmt(net)}</div></div>
        <div class="flex-1 text-center border-l border-gray-800"><div class="text-xs text-gray-500 mb-0.5">Savings Rate</div><div class="font-bold ${savingsRate>=20?'text-emerald-400':'text-amber-400'}">${savingsRate}%</div></div>
        <div class="flex-1 text-center border-l border-gray-800"><div class="text-xs text-gray-500 mb-0.5">vs Last Month</div><div class="font-bold text-gray-400">↑ 51%</div></div>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="bg-[#1d2027] rounded-2xl p-5">
        <div class="text-xs text-gray-500 mb-1">🔥 Daily Burn Rate</div>
        <div class="text-2xl font-bold">${fmt(dailyBurn)}</div>
        <div class="text-xs text-gray-600 mt-1">per day</div>
        <div class="mt-3 pt-3 border-t border-gray-800"><div class="text-xs text-gray-500">Avg monthly spend</div><div class="text-sm font-medium mt-0.5">${editable(m.avgMonthlyExpenses,'monthly.avgMonthlyExpenses',fmt)}</div></div>
      </div>
      <div class="bg-[#1d2027] rounded-2xl p-5">
        <div class="text-xs text-gray-500 mb-1">⏱️ Cash Runway</div>
        <div class="text-2xl font-bold ${runway<14?'text-red-400':runway<30?'text-amber-400':'text-emerald-400'}">${runway}</div>
        <div class="text-xs text-gray-600 mt-1">days remaining</div>
        <div class="mt-3 pt-3 border-t border-gray-800"><div class="text-xs ${runway<14?'text-red-400':runway<30?'text-amber-400':'text-gray-500'}">${runway<14?'⚠️ Income needed soon':runway<30?'Moderate cushion':'Good buffer'}</div></div>
      </div>
    </div>
    <div class="bg-[#1d2027] rounded-2xl p-5 mb-4">
      <div class="flex items-center gap-2 mb-4"><span>🏆</span><span class="font-semibold">Top Spending — ${m.label}</span></div>
      <div class="space-y-3">
        ${m.categories.map((c,i)=>{
          const pct=(c.amount/maxCat)*100;
          return `<div>
            <div class="flex justify-between items-center mb-1.5">
              <div class="flex items-center gap-2 text-sm"><span class="text-base">${c.icon}</span><span>${c.name}</span><span class="text-xs text-gray-600">#${i+1}</span></div>
              <span class="text-sm font-medium">${fmt(c.amount)}</span>
            </div>
            <div class="bg-[#0f1116] rounded-full overflow-hidden" style="height:5px"><div style="width:${pct}%;height:5px;background:${c.color};border-radius:3px;opacity:0.85"></div></div>
          </div>`;}).join('')}
      </div>
    </div>
    <div class="bg-[#1d2027] rounded-2xl p-5 mb-4">
      <div class="flex items-center gap-2 mb-4"><span>🪙</span><span class="font-semibold">Spending Forecast</span></div>
      <div class="flex gap-2 mb-5 flex-wrap">
        ${[7,14,21,30].map(d=>`<button class="tab-btn text-xs px-3 py-1.5 rounded-full ${state.forecastDays===d?'active':'bg-[#2a2d35] text-gray-300'}" onclick="setForecast(${d})">${d} days</button>`).join('')}
      </div>
      <div class="flex justify-between py-2.5 border-b border-gray-800"><span class="text-sm">Current funds</span><span class="font-semibold">${fmt2(assets)}</span></div>
      <div class="text-xs text-gray-600 font-semibold tracking-wider mt-4 mb-2">SCHEDULED INCOME</div>
      ${forecastItems.income.length===0?`<div class="text-xs text-gray-700 py-1.5">None in this window</div>`:forecastItems.income.map(r=>`<div class="flex justify-between items-center py-1.5"><div class="text-sm flex items-center gap-2"><span>${r.icon}</span>${r.name}</div><div class="text-sm ${r.amount===0?'text-gray-700':'text-emerald-400'}">${r.amount===0?'—':'+ '+fmt(r.amount)}</div></div>`).join('')}
      <div class="text-xs text-gray-600 font-semibold tracking-wider mt-4 mb-2">SCHEDULED EXPENSES</div>
      ${forecastItems.expense.length===0?`<div class="text-xs text-gray-700 py-1.5">None in this window</div>`:forecastItems.expense.map(r=>`<div class="flex justify-between items-center py-1.5"><div class="text-sm flex items-center gap-2"><span>${r.icon}</span>${r.name}</div><div class="text-sm text-red-400">− ${fmt(r.amount)}</div></div>`).join('')}
      <div class="flex justify-between items-center pt-4 mt-3 border-t border-gray-800"><span class="font-semibold">Available to spend</span><span class="text-lg font-bold ${available>=0?'text-emerald-400':'text-red-400'}">${fmt2(available)}</span></div>
    </div>
    <div class="bg-[#1d2027] rounded-2xl p-5">
      <div class="flex items-center gap-2 mb-4"><span>🎯</span><span class="font-semibold">Financial Goals</span></div>
      ${state.goals.map(g=>{
        const remaining=g.target-g.saved, months=monthsBetween(g.targetDate), monthly=months>0?remaining/months:0, daily=monthly/30;
        const pct=Math.min((g.saved/g.target)*100,100);
        const dateLabel=new Date(g.targetDate).toLocaleDateString('en-US',{month:'short',year:'numeric'});
        return `<div class="rounded-xl p-4" style="background:#14171c">
          <div class="flex justify-between items-start mb-3">
            <div><div class="font-semibold">${g.icon} ${g.name}</div><div class="text-xs text-gray-500 mt-0.5">Target: ${dateLabel} · ${months} months away</div></div>
            <div class="text-xs px-2 py-1 rounded-full bg-amber-900/30 text-amber-300">${g.status}</div>
          </div>
          <div class="flex justify-between text-sm mb-1.5"><span class="text-gray-500">Saved so far</span><span>${editable(g.saved,`goals.${g.id}.saved`,fmt)} <span class="text-gray-500">of ${fmt(g.target)}</span></span></div>
          <div class="bg-[#0f1116] rounded-full overflow-hidden mb-4" style="height:6px"><div style="width:${pct}%;height:6px;background:linear-gradient(90deg,#f59e0b,#fbbf24);border-radius:3px"></div></div>
          <div class="grid grid-cols-3 gap-2">
            <div class="bg-[#1d2027] rounded-lg p-3"><div class="text-xs text-gray-500">Remaining</div><div class="font-semibold mt-0.5 text-sm">${fmt(remaining)}</div></div>
            <div class="bg-[#1d2027] rounded-lg p-3"><div class="text-xs text-gray-500">Monthly needed</div><div class="font-semibold mt-0.5 text-sm">${fmt(monthly)}</div></div>
            <div class="bg-[#1d2027] rounded-lg p-3"><div class="text-xs text-gray-500">Daily needed</div><div class="font-semibold mt-0.5 text-sm">${fmt(daily)}</div></div>
          </div>
        </div>`;}).join('')}
      <button class="w-full text-sm text-gray-600 mt-3 py-3 px-4 border border-dashed border-gray-800 rounded-xl hover:border-gray-600 hover:text-gray-400 transition-colors">+ Add another goal</button>
    </div>
    <div class="text-center text-xs text-gray-700 mt-8 pb-4">Click any number to edit · Changes saved automatically · <span class="cursor-pointer hover:text-indigo-400" onclick="setView('transactions')">View all transactions →</span></div>`;
}

// ═══════════════════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════════════════
function render() {
  let html;
  if      (currentView==='transactions') html=renderTransactions();
  else if (currentView==='categories')   html=renderCategories();
  else if (currentView==='accounts')     html=renderPlaceholder('Accounts','🏦','Manage bank accounts, e-wallets, and credit cards. Coming soon.');
  else if (currentView==='goals')        html=renderPlaceholder('Goals','🎯','Track savings goals with visual progress. Coming soon.');
  else if (currentView==='recurring')    html=renderPlaceholder('Recurring','🔁','Manage recurring income and expenses. Coming soon.');
  else                                   html=renderDashboard();
  document.getElementById('app').innerHTML=html;
  attachEdits();
}

render();
</script>
</body>
</html>
